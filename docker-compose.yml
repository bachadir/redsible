version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  inventory-api:
    build: ./api
    ports:
      - "8080:8080"
    depends_on:
      - redis
    restart: unless-stopped

  inventory-ui:
    build: 
      context: ./ui
      dockerfile: Dockerfile.ui
    ports:
      - "80:80"
    depends_on:
      - inventory-api
    restart: unless-stopped

volumes:
  redis_data:
