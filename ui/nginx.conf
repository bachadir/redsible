server {
    listen 80;
    server_name localhost;

    # Serve the static React files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Support for React Router / HTML5 History API
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls seamlessly to the Go backend container
    # (Assuming your Go API container is named 'inventory-api' on the docker network)
    location /api/ {
        proxy_pass http://inventory-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}