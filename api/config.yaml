# Redsible API Configuration File

# Server Settings
server:
  port: 8080
  host: "0.0.0.0"

# Redis Database Connection Settings
redis:
  address: "localhost:6379"
  password: ""
  db: 0

# Time-To-Live for edge node inventory records (e.g., '30m', '2h', '24h')
ttl: "2h"

# Eviction Policy Settings
# Set to true for 2-tier (1x warning, 2x hard eviction). Set to false for standard single-tier eviction at 1x TTL.
two_tier_eviction: true
